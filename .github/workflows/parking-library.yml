# Builds the whole-US parking library from OpenStreetMap (scripts/update-library.sh)
# and publishes it to Cloudflare Workers + KV (free tier). Runs on demand and
# when the builder changes. The weekly refresh runs as a scheduled Claude task
# that calls the same script, so this workflow has no schedule of its own.
#
# Publishing needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" and "Workers KV Storage: Edit"
#   CLOUDFLARE_ACCOUNT_ID  17bb38bf5c1449f4cfa3bf5c3cb69587
# Without them the job still builds (a check), and publishing can be done with
# scripts/deploy-parking-library.ts from anywhere that has the token.
name: Parking library

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-parking-library.*'
      - 'scripts/update-library.sh'
      - 'scripts/library-bundles.ts'
      - 'src/lib/tiles.ts'
      - 'src/lib/osm.ts'
      - 'library-worker/**'
      - '.github/workflows/parking-library.yml'

concurrency:
  group: parking-library
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tools
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool

      - name: Build library
        run: |
          DEPLOY=0 scripts/update-library.sh "$RUNNER_TEMP/library-work"
          du -sh "$RUNNER_TEMP/library-work/library"

      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets are not set yet, so the library was built but not published."
            exit 0
          fi
          npx tsx scripts/deploy-parking-library.ts "$RUNNER_TEMP/library-work/library"
